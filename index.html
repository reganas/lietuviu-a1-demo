<script>

const TABS = [

/* the Gramatikos pratimai tab only appears for lessons that have a practice section */

const isReview = () => LESSON.meta.family === 'review';
const lessonTabs = () => isReview()
    ? REVIEW_TABS.map(id => id === 'review' ? { id, label: 'Gramatikos pratimai' } : TABS.find(t => t.id === id))
    : TABS.filter(t => (t.id !== 'practice' || LESSON.practice) && (t.id !== 'review' || LESSON.review) && (t.id !== 'opener' || LESSON.opener) && (t.id !== 'grammar' || LESSON.grammar));

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/* fields marked "rich" may carry <em>/<strong> from the lesson file */
const rich = s => String(s);
const el = (id) => document.getElementById(id);

/* ---------- shell ---------- */
function renderShell() {
    const m = LESSON.meta;
    document.title = m.pageTitle;
    el('app-title').textContent = `Lietuvių kalba · ${m.level}`;
    el('app-subtitle').textContent = `${m.unit}: ${m.title} (${m.subtitle})`;
    el('app-credit').textContent = `© ${m.author}, ${m.year}`;

    el('app-nav').innerHTML = lessonTabs().map((t, i) =>
        `<button onclick="switchTab('${t.id}')" id="tab-${t.id}" class="px-4 py-2.5 rounded-xl font-bold transition-all duration-200 text-sm ${
            i === 0 ? 'bg-primary text-white shadow-md transform hover:-translate-y-0.5'
                    : 'text-slate-500 hover:bg-slate-100 hover:text-slate-700'}">${esc(t.label)}</button>`
    ).join('');

    el('app-main').innerHTML = lessonTabs().map((t, i) =>
        `<section id="${t.id}" class="tab-content${i === 0 ? ' active' : ''}"></section>`
    ).join('');
}

/* previous / next at the bottom: sections first, then the neighbouring lesson */
function drawPager(tabId) {
    const tabs = lessonTabs(), k = tabs.findIndex(t => t.id === tabId);
    const btn = (cls, small, label, go) => `<button class="${cls}" onclick="${go}"><small>${small}</small><span>${esc(label)}</span></button>`;
    let prev = '', next = '';
    if (k > 0) prev = btn('prev', 'Previous', '← ' + tabs[k - 1].label, `switchTab('${tabs[k - 1].id}')`);
    else if (CUR > 0) prev = btn('prev lesson', 'Previous lesson', '← ' + LESSONS[CUR - 1].meta.title, `openLesson(${CUR - 1})`);
    if (k < tabs.length - 1) next = btn('next', 'Next', tabs[k + 1].label + ' →', `switchTab('${tabs[k + 1].id}')`);
    else if (CUR < LESSONS.length - 1) next = btn('next lesson', 'Next lesson', LESSONS[CUR + 1].meta.title + ' →', `openLesson(${CUR + 1})`);
    el('app-pager').innerHTML = prev + next;
}

function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#app-nav button').forEach(b => {
        b.classList.remove('bg-primary', 'text-white', 'shadow-md', 'transform', '-translate-y-0.5');
        b.classList.add('text-slate-500', 'hover:bg-slate-100', 'hover:text-slate-700');
    });
    const target = el(tabId);
    if (target) target.classList.add('active');
    drawPager(tabId);
    const btn = el('tab-' + tabId);
    if (btn) {
        btn.classList.remove('text-slate-500', 'hover:bg-slate-100', 'hover:text-slate-700');
        btn.classList.add('bg-primary', 'text-white', 'shadow-md', 'transform', '-translate-y-0.5');
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

    </div>`;
}

const warmupQs = () => LESSON.warmup.questions || [LESSON.warmup.question];

function checkWarmup(k, i, btn) {
    const o = warmupQs()[k].options[i];

    btn.classList.add(o.correct ? 'bg-success' : 'bg-error', 'text-white');
    fb.textContent = (o.correct ? 'Teisingai. ' : '') + o.why;
    fb.className = 'text-sm font-bold mt-3 ' + (o.correct ? 'text-success' : 'text-error');
}

const LT_LETTERS = ['ą','č','ę','ė','į','š','ų','ū','ž'];
const bare = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

/* matching: click a Lithuanian word, then its meaning (or the other way round) */
const matchState = { right: [], sel: null, done: 0 };

function startMatch() {
    const pairs = LESSON.vocabPractice.match.pairs;
    matchState.right = shuffle(pairs.map((_, i) => i));
    matchState.sel = null; matchState.done = 0;
    const left = shuffle(pairs.map((_, i) => i));
    el('match').innerHTML = `
        <div class="match-grid">
            <div class="match-col">${left.map(i => `<button class="pick" id="ml-${i}" onclick="matchPick('l',${i})">${esc(pairs[i].lt)}</button>`).join('')}</div>
            <div class="match-col">${matchState.right.map(i => `<button class="pick" id="mr-${i}" onclick="matchPick('r',${i})">${esc(pairs[i].en)}</button>`).join('')}</div>
        </div>
        <p id="match-fb" class="text-sm font-bold mt-4" style="min-height:1.25rem"></p>`;
}

function matchPick(side, i) {
    const s = matchState, fb = el('match-fb'), btn = el(`m${side}-${i}`);
    if (!s.sel || s.sel.side === side) {
        if (s.sel) el(`m${s.sel.side}-${s.sel.i}`).classList.remove('sel');
        s.sel = { side, i };
        btn.classList.add('sel');
        fb.textContent = '';
        return;
    }
    const other = el(`m${s.sel.side}-${s.sel.i}`);
    if (s.sel.i === i) {
        [btn, other].forEach(b => { b.classList.remove('sel'); b.classList.add('ok'); b.disabled = true; });
        s.done++;
        const pr = LESSON.vocabPractice.match.pairs[i];
        if (s.done === LESSON.vocabPractice.match.pairs.length) {
            fb.innerHTML = `Teisingai — all matched. <button class="link-btn" onclick="startMatch()">Again</button>`;
        } else fb.textContent = `Teisingai — ${pr.lt} = ${pr.en}.`;
        fb.className = 'text-sm font-bold mt-4 text-success';
    } else {
        btn.classList.add('no');
        setTimeout(() => btn.classList.remove('no'), 600);
        fb.textContent = 'Not a pair — try another.';
        fb.className = 'text-sm font-bold mt-4 text-error';
    }
    s.sel = s.sel.i === i ? null : s.sel;
}

/* spoken recall: works on a shared screen, the learner says it and the teacher clicks */
function sayHtml(s) {
    return `<div class="grid md:grid-cols-2 gap-3">${s.items.map((it, n) => `
        <div class="speaking-card group" onclick="this.classList.toggle('show-hint')">
            <p class="font-bold text-slate-700">${n + 1}. ${esc(it.en)}</p>
            <div class="overflow-hidden transition-all duration-300 max-h-0 group-[.show-hint]:max-h-20">
                <p class="text-success font-bold text-lg mt-2 pt-2 border-t border-slate-100">${esc(it.answer)}</p>
            </div>
        </div>`).join('')}</div>`;
}

function spellHtml(s) {
    return `
        <div class="flex flex-wrap gap-2">
            ${LT_LETTERS.map(c => `<button class="char-btn" onclick="insertChar('${c}')">${c}</button>`).join('')}
        </div>
        ${s.items.map((it, n) => `
        <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
            <p class="font-medium text-slate-700 mb-2">${n + 1}. ${esc(it.en)}</p>
            <input id="sp-${n}" class="hw-input" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"
                   onfocus="lastInput = this" onkeydown="if (event.key === 'Enter') checkSpell()">
            <p id="sp-fb-${n}" class="text-sm font-bold mt-2"></p>
        </div>`).join('')}
        <div><button onclick="checkSpell()" class="bg-primary hover:bg-primaryHover text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-md">Tikrinti</button></div>`;
}

function checkSpell() {
    LESSON.vocabPractice.spell.items.forEach((it, n) => {
        const input = el('sp-' + n), fb = el('sp-fb-' + n);
        const given = tidy(input.value), want = tidy(it.answer);
        input.classList.remove('correct', 'wrong');
        if (given === '') { fb.textContent = ''; return; }
        if (given === want) {
            input.classList.add('correct');
            fb.textContent = 'Teisingai.';
            fb.className = 'text-sm font-bold mt-2 text-success';
        } else {
            input.classList.add('wrong');
            fb.textContent = bare(given) === bare(want)
                ? `Almost — check the letters with marks: ${it.answer}.`
                : `${it.en} = ${it.answer}.`;
            fb.className = 'text-sm font-bold mt-2 text-error';
        }
    });
}

function checkPick(which, n, picked, btn) {
    const p = LESSON.vocabPractice;
    const set = which === 'ex1' ? p.meaning : which === 'ex5' ? p.numbers : which === 'ex6' ? p.phrases : p.toLithuanian;
    const it = set.items[n];
    const box = el(`${which}-${n}`), fb = el(`${which}-fb-${n}`);
    box.querySelectorAll('button').forEach(b => b.classList.remove('bg-success', 'bg-error', 'text-white'));
    if (picked === it.answer) {
        btn.classList.add('bg-success', 'text-white');
        fb.textContent = 'Teisingai.' + (which === 'ex6' && it.why ? ' ' + it.why : '');
        fb.className = 'text-xs font-bold mt-2 text-success';
    } else {
        btn.classList.add('bg-error', 'text-white');
        box.querySelectorAll('button').forEach(b => { if (b.textContent === it.answer) b.classList.add('bg-success', 'text-white'); });
        fb.textContent = which === 'ex6' ? `${it.answer}${it.why ? ' — ' + it.why : ''}` : `${esc(it.word || it.number)} = ${it.answer}.`;
        fb.className = 'text-xs font-bold mt-2 text-error';
    }
}

function checkSort(n, key, btn, g = 0) {
    const pp = pracParts()[g];
    const s = (pp && pp.sort) || LESSON.vocabPractice.sort, it = s.items[n];
    const box = el(`ex3${sfx(g)}-${n}`), fb = el(`ex3${sfx(g)}-fb-${n}`);
    box.querySelectorAll('button').forEach(b => b.classList.remove('bg-success', 'bg-error', 'text-white'));
    const ok = key === it.bucket;
    btn.classList.add(ok ? 'bg-success' : 'bg-error', 'text-white');
    fb.textContent = ok ? `Teisingai — ${it.form}.` : `${it.why} ${it.form}.`;
    fb.className = 'text-sm font-bold w-full ' + (ok ? 'text-success' : 'text-error');
}

function checkOdd(n, picked, btn) {
    const it = LESSON.vocabPractice.oddOneOut.items[n];
    const box = el(`ex4-${n}`), fb = el(`ex4-fb-${n}`);
    box.querySelectorAll('button').forEach(b => b.classList.remove('bg-success', 'bg-error', 'text-white'));
    const ok = picked === it.answer;
    btn.classList.add(ok ? 'bg-success' : 'bg-error', 'text-white');
    fb.textContent = ok ? `Teisingai — ${it.why}` : `The odd one is ${it.answer} — ${it.why}`;
    fb.className = 'text-sm font-bold mt-2 ' + (ok ? 'text-success' : 'text-error');

/* "Find the forms": every word of the dialogue is clickable */
const findState = { found: new Set() };
const fkey = w => w.toLowerCase();

function findHtml(r) {
    findState.found = new Set();
    const targets = new Set(r.find.targets.map(fkey));
    const words = s => esc(s).replace(/[a-zA-ZąčęėįšųūžĄČĘĖĮŠŲŪŽ]+/g, w => `<span class="fw" data-w="${fkey(w)}" onclick="findPick(this)">${w}</span>`);
    return `
    <div class="mb-8 p-6 bg-slate-50 rounded-xl border border-slate-200">
        <h3 class="text-lg font-bold text-slate-800 mb-1">${esc(r.find.title)}</h3>
        <p class="text-sm text-slate-500 mb-4">${rich(r.find.sub)}</p>
        <div class="find-text">${r.lines.map(l => `<p><b class="text-slate-500">${esc(l.who)}:</b> ${words(l.text)}</p>`).join('')}</div>
        <div class="find-bar"><span id="find-count" class="text-slate-500">Found 0 / ${targets.size}</span>
            <button class="link-btn" onclick="findShowAll()">Show all</button></div>
        <p id="find-fb" class="text-sm font-bold mt-2" style="min-height:1.25rem"></p>
    </div>`;
}

function findPick(span) {
    const r = LESSON.reading, w = span.dataset.w;
    const targets = new Set(r.find.targets.map(fkey));
    const fb = el('find-fb');
    if (targets.has(w)) {
        findState.found.add(w);
        document.querySelectorAll(`.fw[data-w="${w}"]`).forEach(s => s.classList.add('hit'));
        const done = findState.found.size === targets.size;
        el('find-count').textContent = `Found ${findState.found.size} / ${targets.size}`;
        fb.textContent = done ? 'Teisingai — all found.' : 'Teisingai.';
        fb.className = 'text-sm font-bold mt-2 text-success';
    } else {
        span.classList.add('miss');
        setTimeout(() => span.classList.remove('miss'), 600);
        fb.textContent = 'Not that one — look for the form the question asks about.';
        fb.className = 'text-sm font-bold mt-2 text-error';
    }
}

function findShowAll() {
    LESSON.reading.find.targets.map(fkey).forEach(w => {
        findState.found.add(w);
        document.querySelectorAll(`.fw[data-w="${w}"]`).forEach(s => s.classList.add('hit'));
    });
    el('find-count').textContent = `Found ${findState.found.size} / ${new Set(LESSON.reading.find.targets.map(fkey)).size}`;
    el('find-fb').textContent = '';
}

function checkReading(n, picked, btn) {
    const q = LESSON.reading.questions[n];
    const box = el(`read-${n}`), fb = el(`read-fb-${n}`);
    box.querySelectorAll('button').forEach(b => b.classList.remove('bg-success', 'bg-error', 'text-white'));
    const ok = picked === q.true_;
    btn.classList.add(ok ? 'bg-success' : 'bg-error', 'text-white');
    fb.textContent = (ok ? 'Teisingai — ' : 'Read again — ') + q.why;
    fb.className = 'text-sm font-bold mt-2 ' + (ok ? 'text-success' : 'text-error');
}

function discoverHtml(d, g = 0) {
    const s = sfx(g);

        <div class="disc-seen">${d.seen.map(x => {
            const i = x.form.lastIndexOf(' ');
            const lead = i < 0 ? '' : esc(x.form.slice(0, i)) + ' ';
            return `<span class="disc-chip">${esc(x.nom)} → ${lead}<b>${esc(x.form.slice(i + 1))}</b></span>`;
        }).join('')}</div>
        ${d.predict.map((p, n) => `
        <div class="disc-item">
            <p class="font-bold text-slate-700 mb-2">${n + 1}. ${esc(p.nom)} → ?</p>
            <div class="flex flex-wrap gap-2" id="dp${s}-${n}">${opts('p', n, place(d.predict, n, x => x.options, x => x.options.indexOf(x.answer)))}</div>
            <p id="dp${s}-fb-${n}" class="text-sm font-bold mt-2"></p>
        </div>`).join('')}

        <div class="disc-item">
            <p class="font-bold text-slate-700 mb-2">${esc(r.prompt)}</p>
            <div class="flex flex-wrap gap-2" id="dr${s}-${n}">${opts('r', n, place(d.rules, n, x => x.options.map(o => o.text), x => x.options.findIndex(o => o.correct)))}</div>
            <p id="dr${s}-fb-${n}" class="text-sm font-bold mt-2"></p>
        </div>`).join('')}
        <p id="disc-reveal${s}" class="hidden text-center font-bold text-success mt-6">${esc(d.reveal)}</p>
        <p class="text-center mt-4"><button id="disc-skip${s}" class="link-btn" onclick="revealGrammar(false,${g})">Skip — show the table</button></p>
    </div>`;
}

function discPick(kind, n, k, btn, g = 0) {
    const d = gramParts()[g].discover, s = sfx(g);
    const box = el(`d${kind}${s}-${n}`), fb = el(`d${kind}${s}-fb-${n}`);
    let ok, why;
    if (kind === 'p') {
        const p = d.predict[n];
        ok = p.options[k] === p.answer;
        why = ok ? `Teisingai — ${p.answer}. ${p.why}` : p.why;
    } else {
        const o = d.rules[n].options[k];
        ok = o.correct;
        why = o.why;
    }
    box.querySelectorAll('.pick').forEach(b => b.classList.remove('no'));
    btn.classList.add(ok ? 'ok' : 'no');
    fb.textContent = why;
    fb.className = 'text-sm font-bold mt-2 ' + (ok ? 'text-success' : 'text-error');
    if (!ok) return;
    box.querySelectorAll('.pick').forEach(b => b.disabled = true);
    discDone[g].add(kind + n);
    if (discDone[g].size === d.predict.length + d.rules.length) revealGrammar(true, g);
}

function revealGrammar(earned, g = 0) {
    const s = sfx(g);
    el('grammar-rest' + s).classList.remove('hidden');
    el('disc-skip' + s).classList.add('hidden');
    if (earned) el('disc-reveal' + s).classList.remove('hidden');
    setTimeout(() => el('grammar-rest' + s).scrollIntoView({ behavior: 'smooth', block: 'start' }), earned ? 600 : 0);
}

/* Answer order. Each exercise's lists are placed together, so the right answer moves
   around without a pattern: a random position for each item, but no position more than
   its fair share of the exercise (2 of 4 items with 3 options; one more in a long one, such
   as a 20-item Testas), and never three times in a
   row. Each entry is [option, its index in the lesson file]. Placed once per page load. */
function arrange(lists, answers) {
    const used = {}, prev = [];
    return lists.map((opts, n) => {
        const m = opts.length, a = answers[n];
        const all = opts.map((o, k) => [o, k]);
        if (m < 2 || !(a >= 0)) return shuffle(all);
        const same = lists.filter(l => l.length === m).length;
        const cap = Math.ceil(same / m) + (same >= 3 * m ? 1 : 0);   // a little slack in a long exercise (the Testas)
        const pos = [...Array(m).keys()];
        const noRun = p => !(prev.length >= 2 && prev[prev.length - 1] === p && prev[prev.length - 2] === p);
        const fair = p => (used[m + ':' + p] || 0) < cap;
        let cand = pos.filter(p => noRun(p) && fair(p));
        if (!cand.length) cand = pos.filter(fair);
        if (!cand.length) cand = pos;
        const p = cand[Math.floor(Math.random() * cand.length)];
        used[m + ':' + p] = (used[m + ':' + p] || 0) + 1;
        prev.push(p);
        const rest = shuffle(all.filter(([, k]) => k !== a));
        rest.splice(p, 0, all[a]);
        return rest;
    });
}
var PLACED;
function place(items, n, opts, ans) {
    PLACED = PLACED || new WeakMap();
    if (!PLACED.has(items)) PLACED.set(items, arrange(items.map(opts), items.map(ans)));
    return PLACED.get(items)[n];
}

function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

function startQuiz() {
    el('quiz-intro').classList.add('hidden');
    el('quiz-results').classList.add('hidden');
    el('quiz-box').classList.remove('hidden');
    quizState.data = shuffle([...LESSON.quiz]);
    quizState.placed = arrange(quizState.data.map(q => q.o), quizState.data.map(q => q.c));
    quizState.index = 0;
    quizState.score = 0;
    loadQuestion();
}

function loadQuestion() {
    quizState.answered = false;
    const q = quizState.data[quizState.index];
    el('quiz-next').classList.add('hidden');
    const why = el('quiz-why');
    why.classList.add('hidden');
    why.textContent = '';
    el('quiz-q').innerHTML = esc(q.q).replace('_____', '<span class="text-primary border-b-2 border-primary inline-block w-24">&nbsp;</span>');
    el('quiz-n').textContent = quizState.index + 1;
    el('quiz-bar').style.width = (quizState.index / quizState.data.length) * 100 + '%';

    const box = el('quiz-opts');
    box.innerHTML = '';
    quizState.placed[quizState.index].forEach(([, idx]) => {
        const b = document.createElement('button');
        b.className = 'quiz-option';
        b.textContent = q.o[idx];
        b.dataset.idx = idx;
        b.onclick = () => selectOption(idx, b);
        box.appendChild(b);
    });
}

function selectOption(idx, btn) {
    if (quizState.answered) return;
    quizState.answered = true;
    const q = quizState.data[quizState.index];
    const opts = el('quiz-opts').children;
    const why = el('quiz-why');

    if (idx === q.c) {
        btn.classList.add('correct');
        quizState.score++;
        why.className = 'max-w-2xl mx-auto mt-6 p-4 rounded-xl border text-sm font-medium bg-emerald-50 border-emerald-200 text-emerald-800';
        why.textContent = 'Teisingai. ' + q.why;
    } else {
        btn.classList.add('wrong');
        Array.from(opts).forEach(b => { if (parseInt(b.dataset.idx) === q.c) b.classList.add('correct'); });
        why.className = 'max-w-2xl mx-auto mt-6 p-4 rounded-xl border text-sm font-medium bg-red-50 border-red-200 text-red-800';
        why.textContent = q.o[q.c] + ' — ' + q.why;
    }
    why.classList.remove('hidden');
    Array.from(opts).forEach(b => { b.style.cursor = 'default'; b.onclick = null; });
    el('quiz-next').classList.remove('hidden');
}

function nextQuestion() {
    quizState.index++;
    if (quizState.index < quizState.data.length) loadQuestion();
    else showResults();
}

function showResults() {
    el('quiz-box').classList.add('hidden');
    el('quiz-results').classList.remove('hidden');
    el('quiz-score').textContent = quizState.score;
    const pct = (quizState.score / quizState.data.length) * 100;
    const v = el('quiz-verdict');
    if (pct >= 90) v.textContent = '🏆 Puikiai!';
    else if (pct >= 70) v.textContent = '👍 Gerai!';
    else if (pct >= 50) v.textContent = '📚 Neblogai.';
    else v.textContent = '💪 Dar kartą!';
}

        ${c.items.map((it, n) => `
        <div class="speaking-card group" onclick="this.classList.toggle('show-hint')">

    <div class="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-100">

            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Kalbėjimas</h2>

        </header>
        <div class="grid md:grid-cols-2 gap-6">
            ${col(s.columnA, 'primary', s.columnA.icon || '🏢')}

        ${s.now ? `
        <div class="mt-10 p-6 bg-sky-50 border border-sky-100 rounded-2xl">
            <h3 class="text-xl font-bold text-slate-800 mb-1 flex items-center gap-2"><span class="text-2xl">🙋</span> ${esc(s.now.title)}</h3>
            <p class="text-sm text-slate-600 mb-5">${rich(s.now.intro)}</p>
            <div class="space-y-4">${s.now.items.map((it, n) => `
            <div class="speaking-card group" onclick="this.classList.toggle('show-hint')">
                <p class="text-lg font-bold text-slate-700 mb-2">${n + 1}. ${esc(it.prompt)}</p>
                <div class="overflow-hidden transition-all duration-300 max-h-0 group-[.show-hint]:max-h-20">
                    <p class="text-success font-medium mt-2 pt-2 border-t border-slate-100">${esc(it.model)}</p>

}

/* ---------- homework ---------- */
let lastInput = null;

function renderHomework() {
    const h = LESSON.homework;
    el('homework').innerHTML = `
    <div class="bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-slate-100">
        <header class="text-center mb-8">
            <div class="text-5xl mb-4">✍️</div>
            <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Namų darbai</h2>
            <p class="text-slate-600 text-lg max-w-xl mx-auto">${rich(h.intro)}</p>
        </header>
        <div class="max-w-xl mx-auto mb-8 bg-amber-50 border border-amber-100 rounded-xl p-4">
            <p class="text-sm font-bold text-amber-900 mb-2">Lithuanian letters</p>
            <p class="text-xs text-amber-800 mb-3">Click a box first, then a letter.</p>
            <div class="flex flex-wrap gap-2">
                ${LT_LETTERS.map(c => `<button class="char-btn" onclick="insertChar('${c}')">${c}</button>`).join('')}
            </div>
        </div>
        ${h.spell ? `
        <div class="max-w-2xl mx-auto mb-4"><h3 class="text-lg font-bold text-slate-800">${esc(h.spell.title)}</h3>${h.spell.sub ? `<p class="text-sm text-slate-500 mt-1">${rich(h.spell.sub)}</p>` : ''}</div>
        <div class="space-y-4 max-w-2xl mx-auto">
            ${h.spell.items.map((it, n) => `
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="font-bold text-slate-700 mb-3">${n + 1}. ${esc(it.en)}</p>
                <input id="hws-${n}" class="hw-input" type="text" autocomplete="off" spellcheck="false" autocapitalize="off">
                <p id="hws-fb-${n}" class="text-sm font-bold mt-2"></p>
            </div>`).join('')}
        </div>
        <div class="mt-12"></div>` : ''}
        ${h.gapTitle ? `<div class="max-w-2xl mx-auto mb-4"><h3 class="text-lg font-bold text-slate-800">${esc(h.gapTitle)}</h3>${h.gapSub ? `<p class="text-sm text-slate-500 mt-1">${rich(h.gapSub)}</p>` : ''}</div>` : ''}
        <div id="hw-list" class="space-y-4 max-w-2xl mx-auto">
            ${h.items.map((it, n) => `
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <p class="font-bold text-slate-700 mb-3">${n + 1}. ${esc(it.sentence).replace('_____', '<span class="text-primary">_____</span>')}</p>
                <input id="hw-${n}" class="hw-input" type="text" autocomplete="off" spellcheck="false" placeholder="${esc(h.placeholder)}">
                <p id="hw-fb-${n}" class="text-sm font-bold mt-2"></p>
            </div>`).join('')}
        </div>
        <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
            <button onclick="checkHomework()" class="bg-primary hover:bg-primaryHover text-white font-bold py-3 px-8 rounded-xl transition-colors shadow-md">Tikrinti</button>
            <button onclick="resetHomework()" class="border-2 border-slate-300 text-slate-600 hover:bg-slate-50 hover:border-slate-400 font-bold py-3 px-8 rounded-xl transition-colors">Išvalyti</button>
        </div>
        <p id="hw-score" class="text-center text-lg font-bold mt-6"></p>
    </div>`;

    const inputs = [...LESSON.homework.items.map((_, n) => el('hw-' + n)),
                    ...(LESSON.homework.spell ? LESSON.homework.spell.items.map((_, n) => el('hws-' + n)) : [])];
    inputs.forEach(input => {
        input.addEventListener('focus', () => { lastInput = input; });
        input.addEventListener('keydown', e => { if (e.key === 'Enter') checkHomework(); });
    });
}

function insertChar(ch) {
    if (!lastInput) return;
    const s = lastInput.selectionStart, e = lastInput.selectionEnd;
    lastInput.value = lastInput.value.slice(0, s) + ch + lastInput.value.slice(e);
    lastInput.focus();
    lastInput.setSelectionRange(s + 1, s + 1);
}

const tidy = s => s.toLowerCase().replace(/\s+/g, ' ').replace(/[.!?]+$/, '').trim();
// a word in brackets may be left out: "Mano vardas (yra) Rasa" accepts both, with and without yra
const variants = ans => {
    let out = [String(ans)];
    while (out.some(x => /\([^)]*\)/.test(x)))
        out = out.flatMap(x => { const m = x.match(/\(([^)]*)\)/); return m ? [x.replace(m[0], m[1]), x.replace(m[0], '')] : [x]; });
    return [String(ans), ...out].map(tidy);
};

function checkHomework() {
    let score = 0;
    LESSON.homework.items.forEach((it, n) => {
        const input = el('hw-' + n), fb = el('hw-fb-' + n);
        const given = tidy(input.value);
        input.classList.remove('correct', 'wrong');
        if (given === '') { fb.textContent = ''; return; }
        if (variants(it.answer).includes(given)) {
            input.classList.add('correct');
            fb.textContent = 'Teisingai.';
            fb.className = 'text-sm font-bold mt-2 text-success';
            score++;
        } else {
            input.classList.add('wrong');
            fb.textContent = it.answer + ' — ' + it.why;
            fb.className = 'text-sm font-bold mt-2 text-error';
        }
    });
    const sp = LESSON.homework.spell;
    if (sp) sp.items.forEach((it, n) => {
        const input = el('hws-' + n), fb = el('hws-fb-' + n);
        const given = tidy(input.value), want = tidy(it.answer);
        input.classList.remove('correct', 'wrong');
        if (given === '') { fb.textContent = ''; return; }
        if (given === want) {
            input.classList.add('correct');
            fb.textContent = 'Teisingai.';
            fb.className = 'text-sm font-bold mt-2 text-success';
            score++;
        } else {
            input.classList.add('wrong');
            fb.textContent = bare(given) === bare(want)
                ? `Almost — check the letters with marks: ${it.answer}.`
                : `${it.en} = ${it.answer}.`;
            fb.className = 'text-sm font-bold mt-2 text-error';
        }
    });
    const total = LESSON.homework.items.length + (sp ? sp.items.length : 0);
    const s = el('hw-score');
    s.textContent = `${score} / ${total}`;
    s.className = 'text-center text-lg font-bold mt-6 text-slate-700';
}

function resetHomework() {
    renderHomework();
    el('hw-score').textContent = '';
    lastInput = null;
}

/* ---------- index of lessons ---------- */
/* lessons are ordered by the school's lesson number (p07_…); a test review (t1_…)
   comes right after the last lesson of its test */
const TEST_RANGE = { 1: [1, 7], 2: [8, 13], 3: [14, 24], 4: [25, 34], 5: [35, 43], 6: [46, 56] };
const GROUPS = [
    { test: 1, from: 1, to: 7 }, { test: 2, from: 8, to: 13 }, { test: 3, from: 14, to: 24 },
    { test: 4, from: 25, to: 34 }, { test: 5, from: 35, to: 43 }, { test: 6, from: 44, to: 56 },
    { test: 0, from: 57, to: 60 }];
const lessonNo = L => { const m = (L.meta.slug || '').match(/^p(\d\d)_/); return m ? +m[1] : 0; };
const testNo = L => { const m = (L.meta.slug || '').match(/^t(\d)_/); return m ? +m[1] : 0; };
const orderKey = L => lessonNo(L) || (testNo(L) ? TEST_RANGE[testNo(L)][1] + 0.5 : 999);
const groupOf = L => GROUPS.findIndex(g => orderKey(L) >= g.from && orderKey(L) < g.to + 1);
const levelOf = g => g.to <= 30 ? 'A1.1' : g.from > 30 ? 'A1.2' : 'A1.1–A1.2';
const countLt = (n, one, few, many) => (n % 10 === 1 && n % 100 !== 11) ? one
    : (n % 10 >= 2 && (n % 100 < 10 || n % 100 > 20)) ? few : many;
let INDEX_OPENED = false;

function renderIndex() {
    el('app-title').textContent = COLLECTION.title;
    el('app-subtitle').textContent = COLLECTION.subtitle;
    const groups = GROUPS.map(g => ({ g, items: [] }));
    const other = [];
    LESSONS.forEach((L, i) => { const k = groupOf(L); (k >= 0 ? groups[k].items : other).push(i); });
    const shown = groups.filter(x => x.items.length);
    const openGroup = INDEX_OPENED ? groupOf(LESSONS[CUR]) : GROUPS.indexOf(shown[0].g);
    const card = i => {
        const L = LESSONS[i], rv = L.meta.family === 'review';
        const label = testNo(L) ? `Pasiruošimas ${testNo(L)} testui` : `${lessonNo(L)} pamoka · ${L.meta.unit}`;
        return `
            <button onclick="openLesson(${i})" class="menu-card${rv ? ' menu-review' : ''}">
                <span class="menu-label">${esc(label)}</span>
                <span class="menu-title">${rv ? '🔁 ' : ''}${esc(L.meta.title)}</span>
                <span class="menu-sub">${esc(L.meta.grammarShort || L.meta.subtitle)}</span>
            </button>`;
    };
    const group = x => {
        const g = x.g, n = x.items.length;
        const name = g.test ? `${g.test} testas · ${g.from}–${g.to} pamokos` : `${g.from}–${g.to} pamokos`;
        return `
        <details class="menu-unit"${GROUPS.indexOf(g) === openGroup ? ' open' : ''}>
            <summary><span>${name} <em class="menu-level-tag">${levelOf(g)}</em></span><small>${n} ${countLt(n, 'programėlė', 'programėlės', 'programėlių')}</small></summary>
            <div class="menu-list">${x.items.map(card).join('')}</div>
        </details>`;
    };
    const n = LESSONS.length;
    el('app-index').innerHTML = `
    <div class="grammar-card">
        <h2 class="text-2xl font-bold text-slate-800 mb-2 flex items-center gap-3 border-b pb-2">
            <span class="text-3xl">📚</span> Programėlės
        </h2>
        <p class="text-slate-600 mb-6">${n} ${countLt(n, 'programėlė', 'programėlės', 'programėlių')}. Open a test block, then pick a lesson.</p>
        ${shown.map(group).join('')}
        ${other.length ? `<div class="menu-list">${other.map(card).join('')}</div>` : ''}
    </div>`;
}

function showIndex() {
    LESSON = null;
    el('app-lesson').classList.add('hidden');
    el('app-index').classList.remove('hidden');
    document.title = COLLECTION.pageTitle;
    renderIndex();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

let CUR = 0;
function openLesson(i) {
    CUR = i;
    INDEX_OPENED = true;
    LESSON = LESSONS[i];
    el('app-index').classList.add('hidden');
    el('app-lesson').classList.remove('hidden');
    el('app-back').innerHTML = LESSONS.length > 1
        ? `<button onclick="showIndex()" class="text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors">← Visos programėlės</button>`
        : '';
    renderShell();
    const has = id => lessonTabs().some(t => t.id === id);
    renderOpener();
    renderReview();
    if (has('lead-in')) renderLeadIn();
    if (has('vocab')) renderVocab();
    renderVocabPractice();
    if (LESSON.vocabPractice.match) startMatch();
    if (has('reading')) renderReading();
    if (has('grammar')) renderGrammar();
    if (has('practice')) renderPractice();
    renderQuiz();
    renderSpeaking();
    renderHomework();
    drawPager(lessonTabs()[0].id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- go ---------- */
if (LESSONS.length === 1) openLesson(0);
else showIndex();
</script>
